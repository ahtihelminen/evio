# The quality gate, on the ops shell runner (slavemaster9000). Runs on every
# merge request and on pushes to main, never manual-only.
#
# Shell executor: the job inherits the host's toolchain (uv) and keeps its
# virtualenv and uv cache between jobs, which is what makes a full
# `make check` cheap enough to run on every push. IMX636 and U3V are not
# built here: `make check` never needs them and their absence is the same
# path a laptop without camera repos takes.

stages: [check]

check:
  stage: check
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
  variables:
    # Keep the virtualenv across jobs; the runner's default clean is -ffdx.
    GIT_CLEAN_FLAGS: -ffdx -e .venv
    UV_CACHE_DIR: /home/gitlab-runner/.cache/uv
  script:
    - uv sync --frozen --extra dev
    - make check
