[project]
name = "evio"
version = "1.3.1"
description = "Minimal library for standardized handling of event camera data."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ahti Helminen" }]
keywords = ["event-camera", "DVS", "neuromorphic", "stream", "asyncio"]
classifiers = [
"Programming Language :: Python :: 3",
"License :: OSI Approved :: MIT License",
"Topic :: Scientific/Engineering :: Image Processing",
]

dependencies = [
    "jupyter>=1.1.1",
    "matplotlib>=3.10.8",
    "numba>=0.62.1",
    "numpy>=1.24",
    "opencv-python>=4.11.0.86",
    "pandas>=2.3.3",
    "pyside6>=6.10.1",
    "pyyaml>=6.0.3",
    "sapient",
]

[project.optional-dependencies]
ids = [
  "ids-peak; platform_system != 'Darwin'",
  "ids-peak-ipl; platform_system != 'Darwin'",
]

dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.6",
    "types-setuptools",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.uv]
default-groups = []

[tool.uv.sources]
sapient = { path = "../sapient", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 80
target-version = "py312"
extend-exclude = ["*.ipynb", "tests/fixtures"]

[tool.ruff.lint]
select = [
	"A",    # builtins
	"ANN",  # type annotations
	"B",    # bugbear
	"BLE",  # blind exception
	"C4",   # comprehensions
	"COM",  # commas
	"E",    # pycodestyle
	"EM",   # errormessage
	"EXE",  # executable
	"F",    # pyflakes
	"FURB", # refurb
	"I",    # isort
	"ICN",  # import-conventions
	"INP",  # implicit-namespace-package
	"NPY",  # numpy
	"PERF", # perflint
	"PIE",  # misc dict stuff
	"PTH",  # pathlib
	"RET",  # return
	"RUF",  # ruff
	"SIM",  # simplify
	"T10",  # debugger
	"TRY",  # tryceratops
	"UP",   # pyupgrade
]
ignore = [
	"COM812",
]

[tool.ruff.lint.per-file-ignores]
# The emitter deliberately catches any subscriber exception to keep the
# detection pipeline running when a downstream consumer misbehaves.
"src/evio/detection/emitter.py" = ["BLE001"]
