[project]
name = "evio"
version = "1.3.1"
description = "Minimal library for standardized handling of event camera data."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Ahti Helminen" }]
keywords = ["event-camera", "DVS", "neuromorphic", "stream", "asyncio"]
classifiers = [
"Programming Language :: Python :: 3",
"License :: OSI Approved :: MIT License",
"Topic :: Scientific/Engineering :: Image Processing",
]

dependencies = [
    "jupyter>=1.1.1",
    "matplotlib>=3.10.8",
    "numba>=0.62.1",
    "numpy>=1.24",
    "opencv-python>=4.11.0.86",
    "pandas>=2.3.3",
    "pyside6>=6.10.1",
    "pyserial>=3.5",
    "pyyaml>=6.0.3",
    "sapient",
    "torch>=2.6",
    "websockets>=16.0",
]

[project.optional-dependencies]
ids = [
  "ids-peak; platform_system != 'Darwin'",
  "ids-peak-ipl; platform_system != 'Darwin'",
]

# Dataset-acquisition tools: install with `uv pip install '.[data]'`.
data = [
    "gdown>=5.2.0",        # Google Drive (FRED, NeRDD)
    "datasets>=3.0.0",     # HuggingFace (Ev-Flying)
    "kagglehub>=0.3.0",    # Kaggle (Drone-vs-Bird)
]

# iGPU inference backend: the Arc 140T on the field NUC runs the v2
# transformer at FP16. The CPU plugin also works on macOS arm64, so the
# export + parity test are developable off-rig. Install with
# `uv pip install '.[openvino]'`.
openvino = [
    "openvino>=2025.0",
]

# Test-site edge-node compliance surface: `uv sync --extra testsite`.
# Opt-in so the core install stays lean; the data plane vendors the shared
# wire models, the control sidecar is FastAPI. See
# docs/integration/test-site-compliance-plan.md.
testsite = [
    "test-site-protocol",  # shared WS envelope + payload models (authoritative)
    "fastapi>=0.110",      # control sidecar (port 18001)
    "uvicorn>=0.29",       # ASGI server for the sidecar
]

dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.6",
    "types-setuptools",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.uv]
default-groups = []

# Torch ships multi-GB CUDA wheels by default on Linux; the field NUC is
# CPU-only, so pull the CPU build there. macOS keeps the default PyPI wheel,
# which already includes MPS support.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
sapient = { path = "../sapient", editable = true }
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
# Pinned to the published tag (vendor from a tag, not a loose path) so it
# resolves in CI -- matches how the backend vendors the shared protocol models.
test-site-protocol = { git = "ssh://git@git.sensofusion.com/testsite/test-site-protocol.git", tag = "v0.1.0" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 80
target-version = "py312"
extend-exclude = ["*.ipynb", "tests/fixtures", "scripts/_archive"]

[tool.ruff.lint]
select = [
	"A",    # builtins
	"ANN",  # type annotations
	"B",    # bugbear
	"BLE",  # blind exception
	"C4",   # comprehensions
	"COM",  # commas
	"E",    # pycodestyle
	"EM",   # errormessage
	"EXE",  # executable
	"F",    # pyflakes
	"FURB", # refurb
	"I",    # isort
	"ICN",  # import-conventions
	"INP",  # implicit-namespace-package
	"NPY",  # numpy
	"PERF", # perflint
	"PIE",  # misc dict stuff
	"PTH",  # pathlib
	"RET",  # return
	"RUF",  # ruff
	"SIM",  # simplify
	"T10",  # debugger
	"TRY",  # tryceratops
	"UP",   # pyupgrade
]
ignore = [
	"COM812",
]

[tool.ruff.lint.per-file-ignores]
# Corpus-build and predecode scripts must set OMP/MKL/OpenBLAS env vars
# BEFORE importing numpy so worker BLAS pools stay capped — this is what
# avoids the thread storm that previously wedged the multiprocessing
# pool on the trainer (documented in the corpus-build-lessons memory).
# That forces imports to come after a small block of statements, which
# is exactly what E402 disallows.
"scripts/build_temporal_corpus_parallel.py" = ["E402"]
"scripts/predecode_event_caches.py" = ["E402"]
"scripts/extract_rain_84.py" = ["E402"]
"scripts/extract_fred_neg.py" = ["E402"]
# The emitter deliberately catches any subscriber exception to keep the
# detection pipeline running when a downstream consumer misbehaves.
"src/evio/detection/emitter.py" = ["BLE001"]
# The GUI catches arbitrary exceptions from camera grab() / solver so a
# transient failure surfaces in the UI rather than killing the session.
"src/evio/calibration/gui.py" = ["BLE001"]
# The encoder worker catches arbitrary exceptions so a buggy clip encode
# logs and continues instead of killing the worker thread.
"src/evio/media/manager.py" = ["BLE001"]
# Detection is best-effort overlay: any error trips a kill-switch and the
# panorama keeps streaming, so the chain is wrapped in a blind except.
"src/evio/streaming/live_detection.py" = ["BLE001"]
# Worker-side detection is best-effort too: safe_update swallows any failure
# so a detector bug disables detection for one camera instead of killing the
# streaming/recording worker process.
"src/evio/detection/live_camera.py" = ["BLE001"]
