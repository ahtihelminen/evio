[project]
name = "evio"
version = "2.0.0"
description = "Field-deployable event-camera detection appliance."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Ahti Helminen" }]
keywords = ["event-camera", "DVS", "neuromorphic", "detection", "SAPIENT"]
classifiers = [
"Programming Language :: Python :: 3",
"License :: OSI Approved :: MIT License",
"Topic :: Scientific/Engineering :: Image Processing",
]

# Measured against the whole tree (src + scripts + tests): cv2, imx636,
# ids_peak(+_ipl), numba, numpy, openvino, sapient, torch, yaml. Nothing
# else. The research half of the old repo (Qt viewer, notebooks, training,
# flight scoring, test-site edge) lives in evioR and carries its own deps.
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.11.0.86",
    "numba>=0.62.1",
    "pyyaml>=6.0.3",
    "openvino>=2026.2.0",
    "sapient",
    # Loads the .pt classifier checkpoint the mast runs today. OpenVINO IR
    # inference needs only numpy+openvino, so this becomes an optional extra
    # once the field switches to IR (plans/repo_split_evioF_evioR.md F3).
    "torch>=2.6",
    # torch's +xpu wheels need triton-xpu, published only on the PyTorch xpu
    # index (mapped in [tool.uv.sources]). uv applies sources to direct deps
    # but not to this transitive one, so declare it directly, gated to linux.
    "triton-xpu; sys_platform == 'linux'",
    # IDS-peak mono camera SDK. Linux-only wheels; the marker filters out
    # macOS dev machines. A default dep so a plain `uv sync` on a fresh NUC
    # installs everything the systemd service needs.
    "ids-peak; platform_system != 'Darwin'",
    "ids-peak-ipl; platform_system != 'Darwin'",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.6",
    "types-setuptools",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.uv]
default-groups = []
# Resolve for 3.12 only (both the dev Mac and the field NUC run it). The XPU
# torch wheels don't cover the open-ended `requires-python` range, so an
# unconstrained universal resolve backtracks to a broken old +xpu build.
environments = [
    "sys_platform == 'darwin' and python_version == '3.12'",
    "sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.12'",
]

# Torch ships multi-GB CUDA wheels by default on Linux; the field NUC has an
# Intel Arc iGPU, so pull the XPU build there for GPU inference. macOS keeps
# the default PyPI wheel, which already includes MPS support.
[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = true

[tool.uv.sources]
sapient = { path = "../sapient", editable = true }
torch = [{ index = "pytorch-xpu", marker = "sys_platform == 'linux'" }]
# triton-xpu (declared above as a direct linux dep) is published only here,
# not on PyPI. Declaring it directly + this source pins the linux torch to
# the >=2.10 line that depends on triton-xpu.
triton-xpu = [{ index = "pytorch-xpu" }]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 80
target-version = "py312"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = [
	"A",    # builtins
	"ANN",  # type annotations
	"B",    # bugbear
	"BLE",  # blind exception
	"C4",   # comprehensions
	"COM",  # commas
	"E",    # pycodestyle
	"EM",   # errormessage
	"EXE",  # executable
	"F",    # pyflakes
	"FURB", # refurb
	"I",    # isort
	"ICN",  # import-conventions
	"INP",  # implicit-namespace-package
	"NPY",  # numpy
	"PERF", # perflint
	"PIE",  # misc dict stuff
	"PTH",  # pathlib
	"RET",  # return
	"RUF",  # ruff
	"SIM",  # simplify
	"T10",  # debugger
	"TRY",  # tryceratops
	"UP",   # pyupgrade
]
ignore = [
	"COM812",
]

[tool.ruff.lint.per-file-ignores]
# run_ops applies BLAS/numexpr thread caps before numpy import so the
# per-camera forked workers don't each spawn an all-core pool and pin the
# P-cores; that requires statements before the imports, which E402 forbids.
"scripts/run_ops.py" = ["E402"]
# The emitter deliberately catches any subscriber exception to keep the
# detection pipeline running when a downstream consumer misbehaves.
"src/evio/detection/emitter.py" = ["BLE001"]
# The encoder worker catches arbitrary exceptions so a buggy clip encode
# logs and continues instead of killing the worker thread.
"src/evio/media/manager.py" = ["BLE001"]
# Worker-side detection is best-effort: safe_update swallows any failure so
# a detector bug disables detection for one camera instead of killing the
# streaming/recording worker process.
"src/evio/detection/live_camera.py" = ["BLE001"]
# Mono-footage capture runs on a background thread against the IDS Peak SDK;
# any open/grab failure is logged and ends capture rather than crashing the
# runner, so the camera-grab boundary is wrapped in a blind except.
"src/evio/recording/mono_capture.py" = ["BLE001"]
# The JIT warm-up in __enter__ is best-effort: a numba compile failure must
# not kill mono footage capture, which only reads raw frames, so it is
# wrapped in a blind except.
"src/evio/io/mono_camera.py" = ["BLE001"]
