[project]
name = "evio"
version = "3.0.0"
description = "Event-camera data handling: codecs, camera access, geometry, rendering and detection."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Ahti Helminen" }]
keywords = ["event-camera", "DVS", "neuromorphic", "detection"]
classifiers = [
"Programming Language :: Python :: 3",
"License :: OSI Approved :: MIT License",
"Topic :: Scientific/Engineering :: Image Processing",
]

# What evio itself imports. The native camera drivers (imx636, u3v) are not
# on PyPI: they are built from their sibling repos and linked into the venv
# by `make drivers`, and evio imports them lazily, so a laptop without a
# camera still installs and runs everything else.
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.11.0.86",
    "numba>=0.62.1",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
# OpenVINO IR inference for the temporal-transformer classifier.
openvino = ["openvino>=2026.2.0"]
# The torch checkpoint path and the IR export tooling. torch's +xpu wheels
# need triton-xpu, published only on the PyTorch xpu index (mapped in
# [tool.uv.sources]); uv applies sources to direct deps but not to this
# transitive one, so declare it directly, gated to linux.
torch = ["torch>=2.6", "triton-xpu; sys_platform == 'linux'"]
# The IDS Peak mono-camera backend (`EVIO_MONO_BACKEND=ids_peak`). Linux-only
# wheels; the marker filters out macOS dev machines.
ids-peak = [
    "ids-peak; platform_system != 'Darwin'",
    "ids-peak-ipl; platform_system != 'Darwin'",
]
dev = [
    "evio[openvino,torch,ids-peak]",
    "coverage>=7.10",
    "pytest>=9.0.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evio"]

[tool.uv]
default-groups = []
# Resolve for 3.12 only (the dev Mac and the OPS units both run it). The XPU
# torch wheels don't cover the open-ended `requires-python` range, so an
# unconstrained universal resolve backtracks to a broken old +xpu build.
environments = [
    "sys_platform == 'darwin' and python_version == '3.12'",
    "sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.12'",
]

# Torch ships multi-GB CUDA wheels by default on Linux; the OPS units have an
# Intel Arc iGPU, so pull the XPU build there. macOS keeps the default PyPI
# wheel, which already includes MPS support.
[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-xpu", marker = "sys_platform == 'linux'" }]
# triton-xpu (declared above as a linux dep of the torch extra) is published
# only here, not on PyPI.
triton-xpu = [{ index = "pytorch-xpu" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
# --strict-markers: an unregistered marker is an error, not a silent no-op, so
#   a typo'd tier marker cannot select nothing and read green.
# --strict-config: an unknown key here is an error rather than ignored.
# xfail_strict: an xfail that starts passing is a failure, so a negative
#   control that stops controlling anything cannot report green.
addopts = ["--strict-markers", "--strict-config"]
xfail_strict = true
markers = [
    "hardware: requires a real event camera; excluded from the default run",
    "t1: unit tier -- no process, socket, sleep, clock, server or browser",
    "t2: component tier -- real processes, sockets and files",
]

[tool.ruff]
line-length = 80
target-version = "py312"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = [
	"A",    # builtins
	"ANN",  # type annotations
	"B",    # bugbear
	"BLE",  # blind exception
	"C4",   # comprehensions
	"COM",  # commas
	"E",    # pycodestyle
	"EM",   # errormessage
	"EXE",  # executable
	"F",    # pyflakes
	"FURB", # refurb
	"I",    # isort
	"ICN",  # import-conventions
	"INP",  # implicit-namespace-package
	"NPY",  # numpy
	"PERF", # perflint
	"PIE",  # misc dict stuff
	"PTH",  # pathlib
	"RET",  # return
	"RUF",  # ruff
	"SIM",  # simplify
	"T10",  # debugger
	"TRY",  # tryceratops
	"UP",   # pyupgrade
]
ignore = [
	"COM812",
]

[tool.ruff.lint.per-file-ignores]
# The emitter deliberately catches any subscriber exception to keep the
# detection pipeline running when a downstream consumer misbehaves.
"src/evio/detection/emitter.py" = ["BLE001"]
# Worker-side detection is best-effort: safe_update swallows any failure so
# a detector bug disables detection for one camera instead of killing the
# streaming/recording worker process.
"src/evio/detection/live_camera.py" = ["BLE001"]
# Mono-footage capture runs on a background thread against the camera SDK;
# any open/grab failure is logged and ends capture rather than crashing the
# caller, so the camera-grab boundary is wrapped in a blind except.
"src/evio/recording/mono_capture.py" = ["BLE001"]
# The JIT warm-up in __enter__ is best-effort: a numba compile failure must
# not kill mono footage capture, which only reads raw frames, so it is
# wrapped in a blind except.
"src/evio/io/mono_backends/ids_peak.py" = ["BLE001"]
