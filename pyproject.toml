[project]
name = "evio"
version = "1.3.1"
description = "Minimal library for standardized handling of event camera data."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ahti Helminen" }]
keywords = ["event-camera", "DVS", "neuromorphic", "stream", "asyncio"]
classifiers = [
"Programming Language :: Python :: 3",
"License :: OSI Approved :: MIT License",
"Topic :: Scientific/Engineering :: Image Processing",
]

dependencies = [
    "jupyter>=1.1.1",
    "matplotlib>=3.10.8",
    "numba>=0.62.1",
    "numpy>=1.24",
    "opencv-python>=4.11.0.86",
    "pandas>=2.3.3",
    "pyside6>=6.10.1",
    "pyserial>=3.5",
    "pyyaml>=6.0.3",
    "sapient",
    "websockets>=16.0",
]

[project.optional-dependencies]
ids = [
  "ids-peak; platform_system != 'Darwin'",
  "ids-peak-ipl; platform_system != 'Darwin'",
]

# Dataset-acquisition tools: install with `uv pip install '.[data]'`.
data = [
    "gdown>=5.2.0",        # Google Drive (FRED, NeRDD)
    "datasets>=3.0.0",     # HuggingFace (Ev-Flying)
    "kagglehub>=0.3.0",    # Kaggle (Drone-vs-Bird)
]

# Learned-classifier training + inference: `uv pip install '.[ml]'`.
ml = [
    "torch>=2.4",          # CNN training (MPS backend on macOS)
]

dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.6",
    "types-setuptools",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.uv]
default-groups = []

[tool.uv.sources]
sapient = { path = "../sapient", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 80
target-version = "py312"
extend-exclude = ["*.ipynb", "tests/fixtures"]

[tool.ruff.lint]
select = [
	"A",    # builtins
	"ANN",  # type annotations
	"B",    # bugbear
	"BLE",  # blind exception
	"C4",   # comprehensions
	"COM",  # commas
	"E",    # pycodestyle
	"EM",   # errormessage
	"EXE",  # executable
	"F",    # pyflakes
	"FURB", # refurb
	"I",    # isort
	"ICN",  # import-conventions
	"INP",  # implicit-namespace-package
	"NPY",  # numpy
	"PERF", # perflint
	"PIE",  # misc dict stuff
	"PTH",  # pathlib
	"RET",  # return
	"RUF",  # ruff
	"SIM",  # simplify
	"T10",  # debugger
	"TRY",  # tryceratops
	"UP",   # pyupgrade
]
ignore = [
	"COM812",
]

[tool.ruff.lint.per-file-ignores]
# Corpus-build and predecode scripts must set OMP/MKL/OpenBLAS env vars
# BEFORE importing numpy so worker BLAS pools stay capped — this is what
# avoids the thread storm that previously wedged the multiprocessing
# pool on the trainer (documented in the corpus-build-lessons memory).
# That forces imports to come after a small block of statements, which
# is exactly what E402 disallows.
"scripts/build_temporal_corpus_parallel.py" = ["E402"]
"scripts/predecode_event_caches.py" = ["E402"]
"scripts/extract_rain_84.py" = ["E402"]
"scripts/extract_fred_neg.py" = ["E402"]
# The emitter deliberately catches any subscriber exception to keep the
# detection pipeline running when a downstream consumer misbehaves.
"src/evio/detection/emitter.py" = ["BLE001"]
# The GUI catches arbitrary exceptions from camera grab() / solver so a
# transient failure surfaces in the UI rather than killing the session.
"src/evio/calibration/gui.py" = ["BLE001"]
# The encoder worker catches arbitrary exceptions so a buggy clip encode
# logs and continues instead of killing the worker thread.
"src/evio/media/manager.py" = ["BLE001"]
